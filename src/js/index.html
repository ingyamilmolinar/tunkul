<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Tunkul - Ebitengine WASM</title>
  <style>
    body, html { margin:0; padding:0; background:#222; }
  </style>
</head>
<body>
  <script type="module" src="audio.js"></script>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go(); // from wasm_exec.js
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
      .then(result => {
        go.run(result.instance);
        console.log("Tunkul WASM game started");
        // Disable simpleDraw mode once WASM is loaded to show full UI
        const disableSimpleDraw = () => {
          if (typeof setSimpleDraw === "function") {
            try { setSimpleDraw(false); } catch (_) {}
            return;
          }
          requestAnimationFrame(disableSimpleDraw);
        };
        disableSimpleDraw();
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
